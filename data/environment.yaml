---
repo: "{{ playbook_dir | dirname }}"

paths:
  etc: "/etc"
  tasks: "{{ repo }}/ansible/tasks"
  templates: "{{ repo }}/ansible/templates"

pipeline:
  inventory: "{{ repo }}/ansible/inventory/transform.py"
  playbook_pattern: "{{ repo }}/ansible/{action}-{host}.yml"

domains:
  local: "rsk.al"
  public: "raskal.io"

tz: "America/Vancouver"

users:
  - name: "root"
    role: "Root"
    home: "/root"
    state: "present"
  - name: "raskal"
    role: "Admin"
    email: "labs@raskal.io"
    home: "/home/raskal"
    state: "present"

packages:
  - bind-utils
  - curl
  - git
  - htop
  - ipcalc
  - mtr
  - nano
  - tmux
  - traceroute
  - tree
  - wget

packages_absent: []

ntp:
  servers:
    - "0.fedora.pool.ntp.org"
    - "1.fedora.pool.ntp.org"
    - "2.fedora.pool.ntp.org"
    - "3.fedora.pool.ntp.org"

