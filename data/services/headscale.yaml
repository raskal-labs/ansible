---
id: headscale
security_profile: hardened
mesh_subnet: 100.64.0.0/24
mesh_gateway_network: 64
mesh_gateway_host: 4
derp:
  port: 3478
server:
  # Headscale runs on ultra64 (the router, 10.64.0.1).
  host_network: 64
  host: 1
  grpc_port: 50443
  metrics_port: 9090
database:
  sqlite:
    path: /var/lib/headscale/db.sqlite
  # ⚠️ Back up db_path before any ultra64 OS-level changes or redeploys.
  # All enrolled nodes, users, and pre-auth keys live here.
  # Losing this file requires re-enrolling all devices.
packages:
  - headscale
templates:
  - source: headscale.yaml.j2
    destination: /etc/headscale/config.yaml
state:
  # State survival matrix:
  # - ultra64 Ansible redeploy:  SAFE  (DB at db_path is not touched by Ansible)
  # - Headscale service restart: SAFE  (DB persists)
  # - Package upgrade:           SAFE  (DB not touched by package manager)
  # - ultra64 OS reinstall:      LOST  unless db_path is backed up first
  db_backup_path: /root/headscale-db-backups/
description: >
  Headscale self-hosted VPN mesh coordination server. Runs on ultra64 (the
  router, 10.64.0.1). Exposes the coordination endpoint wfc.raskal.io via
  Caddy reverse proxy on the same host. DERP/STUN traffic is forwarded
  directly on UDP 3478. gamecube (10.64.0.4) acts as the mesh exit node /
  subnet router within the Headscale mesh, but does NOT run the server.
  Clients enroll using: tailscale up --login-server https://wfc.raskal.io
