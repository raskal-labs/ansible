identity:
  hostname: ultra64
profile: router
status: Operational
os: Fedora 44 Server Minimal
network: 64
host: 1
hw:
  cpu: AMD RX-427BB Quad-Core APU
  ram: 8GB (2x4GB) DDR3 SODIMM 1600 MT/s
  gpu: Integrated AMD Radeon R7
  storage:
  - dev: M.2 Slot (Primary)
    type: 64GB M.2 2280 SATA SSD
    fs: ext4
    mounts:
    - /boot/efi (976M)
    - / (54.7G)
    - '[SWAP] (3G)'
  slots:
  - 'Low-profile PCIe 2.0 x8 (In Use: Intel 82571EB Dual-Port GbE)'
  ports:
  - 1 x GbE (Realtek)
  - 2 x GbE (Intel)
  - 4 x DisplayPort 1.2
  - 4 x USB 3.0 / 4 x USB 2.0
  - 1 x Serial / 1 x Parallel

opts:
  grub_timeout: 1
  kernel_args:
  - panic=10

interfaces:
  wan:
    dev: enp1s0f0
    mac: "24:2F:D0:D1:2E:31"
  lan:
    dev: enp1s0f1

host_services:
  dhcp:
    network: 64
    range_start: 100
    range_end: 200
    dns_host: 1
  vpn:
    port: 51820
    privkey: "{{ vault_wg_ultra64_private_key }}"
    host_id: 1
    peers:
      - name: gcp-aider
        pubkey: "TPc/hcMYdohDuuD9pkadydtGnUlOTf1q2e4lSYf8e04=="
        host_id: 5
        extra_networks:
          - network: 64
            host: 5
        route_lan: true

packages:
  - conntrack-tools
  - ethtool
  - iftop
  - iperf3
  - net-tools
  - nload
  - nmap
  - socat
  - tcpdump
  - wireguard-tools

packages_absent:
  - firewalld
  - netbird
  - systemd-resolved
  - dnscrypt-proxy

# host_keys intentionally omitted until real keys are captured.
# To populate, run on your workstation:
#   ssh-keyscan -t ed25519,rsa 10.64.0.1
# Then add the keys here:
# host_keys:
#   ssh-ed25519: "AAAAC3Nz..."
#   ssh-rsa: "AAAAB3Nz..."
# Then re-run: python3 compile.py
