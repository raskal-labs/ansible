---
service_profiles:
  edge_router:
    description: "Modular Linux routing and DNS pipeline"
    packages:
      - "kea"
      - "unbound"
      - "dnscrypt-proxy"
      - "nftables"
      - "systemd-networkd"
      - "nano"
    configurations:
      - service: "kea-dhcp4"
        src: "templates/kea-dhcp4.conf.j2"
        target_dest: "/etc/kea/kea-dhcp4.conf"
        has_override: true
      - service: "unbound"
        src: "templates/unbound.conf.j2"
        target_dest: "/etc/unbound/unbound.conf"
        has_override: true
      - service: "dnscrypt-proxy"
        src: "templates/dnscrypt-proxy.toml.j2"
        target_dest: "/etc/dnscrypt-proxy/dnscrypt-proxy.toml"
        has_override: true
      - service: "nftables"
        src: "templates/nftables.conf.j2"
        target_dest: "/etc/nftables.conf"
        has_override: false
