---
profiles:
  router:
    desc: "Modular Linux routing and DNS pipeline"
    pkgs: ["kea", "unbound", "dnscrypt-proxy", "nftables", "systemd-networkd", "nano", "make"]
    files:
      - svc: "kea-dhcp4"
        src: "kea-dhcp4.conf.j2"
        dest: "/etc/kea/kea-dhcp4.conf"
        mode: "0644"
        test: "kea-dhcp4 -t %s"
        override: true
      - svc: "unbound"
        src: "unbound.conf.j2"
        dest: "/etc/unbound/unbound.conf"
        mode: "0644"
        test: "unbound-checkconf %s"
        override: true
      - svc: "dnscrypt-proxy"
        src: "dnscrypt-proxy.toml.j2"
        dest: "/etc/dnscrypt-proxy/dnscrypt-proxy.toml"
        mode: "0644"
        test: "dnscrypt-proxy -check -config %s"
        override: true
      - svc: "nftables"
        src: "nftables.conf.j2"
        dest: "/etc/nftables.conf"
        mode: "0600"
        test: "nft -c -f %s"
        override: false
