---
- name: Deploy Kea DHCP configuration
  ansible.builtin.template:
    src: "kea-dhcp4.conf.j2"
    dest: "/etc/kea/kea-dhcp4.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart kea-dhcp4

- name: Create systemd override directory
  ansible.builtin.file:
    path: "/etc/systemd/system/kea-dhcp4.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy systemd override
  ansible.builtin.template:
    src: "kea-dhcp4-override.conf.j2"
    dest: "/etc/systemd/system/kea-dhcp4.service.d/override.conf"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart kea-dhcp4

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure Kea DHCP is enabled and started
  ansible.builtin.systemd:
    name: kea-dhcp4
    state: started
    enabled: true
