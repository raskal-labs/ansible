---
- name: Fetch latest Blocky release metadata from GitHub API
  ansible.builtin.uri:
    url: "https://api.github.com/repos/0xERR0R/blocky/releases/latest"
    return_content: true
    headers:
      Accept: "application/vnd.github.v3+json"
      User-Agent: "Ansible-Blocky-Updater"
  register: blocky_api_response
  check_mode: false

- name: Extract Linux x86_64 download URL
  ansible.builtin.set_fact:
    blocky_download_url: >-
      {{ 
        blocky_api_response.json.assets 
        | selectattr('name', 'search', 'Linux_x86_64.tar.gz') 
        | map(attribute='browser_download_url') 
        | first 
      }}

- name: Download latest Blocky release via curl (bypassing urllib3 bug)
  ansible.builtin.command: "curl -sL -o /tmp/blocky.tar.gz {{ blocky_download_url }}"
  args:
    creates: /usr/local/bin/blocky
  check_mode: false

- name: Extract Blocky binary
  ansible.builtin.unarchive:
    src: /tmp/blocky.tar.gz
    dest: /usr/local/bin/
    remote_src: yes
    extra_opts:
      - blocky
    creates: /usr/local/bin/blocky
  notify: Restart blocky

- name: Ensure Blocky binary is executable
  ansible.builtin.file:
    path: /usr/local/bin/blocky
    mode: '0755'
    owner: root
    group: root

- name: Deploy Blocky systemd base service
  ansible.builtin.template:
    src: blocky.service.j2
    dest: /etc/systemd/system/blocky.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart blocky

- name: Ensure configuration directories exist
  ansible.builtin.file:
    path: /etc/blocky
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy core DNS configurations
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: 'unbound.conf.j2', dest: '/etc/unbound/unbound.conf', svc: 'unbound' }
    - { src: 'blocky.yml.j2', dest: '/etc/blocky/blocky.yml', svc: 'blocky' }
  notify: "Restart {{ item.svc }}"

- name: Create systemd override directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - unbound
    - blocky

- name: Deploy systemd overrides
  ansible.builtin.template:
    src: "{{ item }}-override.conf.j2"
    dest: "/etc/systemd/system/{{ item }}.service.d/override.conf"
    owner: root
    group: root
    mode: '0644'
  loop:
    - unbound
    - blocky
  notify:
    - Reload systemd daemon
    - "Restart {{ item }}"

- name: Flush handlers before starting services
  ansible.builtin.meta: flush_handlers

- name: Ensure DNS services are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - blocky
    - unbound

- name: Verify local DNS lookup before resolv.conf update
  ansible.builtin.command: getent ahosts localhost
  changed_when: false

- name: Remove systemd-resolved resolv.conf symlink
  ansible.builtin.file:
    path: "/etc/resolv.conf"
    state: absent

- name: Create static resolv.conf pointing to local resolver
  ansible.builtin.copy:
    dest: "/etc/resolv.conf"
    content: "nameserver 127.0.0.1\n"
    owner: root
    group: root
    mode: '0644'
