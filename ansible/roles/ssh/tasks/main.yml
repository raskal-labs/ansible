---
# SSH Role - Deploy authorized keys and private keys

- name: Ensure .ssh directory exists for root
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: '0700'
    owner: root
    group: root
  tags:
    - ssh

- name: Deploy authorized keys for system accounts
  ansible.posix.authorized_key:
    user: "{{ item.0.username }}"
    key: "{{ item.1.key }}"
    comment: "{{ item.1.name }}"
    state: present
  loop: "{{ global_identities | subelements('authorized_clients', skip_missing=True) }}"
  tags:
    - ssh
    - authorized_keys

# NOTE (audit fix 2026-08-14): previously hardcoded to
# vault_ultra64_private_key, which would deploy ultra64's private key to
# ANY host this role was applied to. This now derives the vault variable
# name per-host (vault_<inventory_hostname>_private_key), matching the
# existing naming convention (e.g. vault_ultra64_private_key for ultra64).
# Each additional host must define its own vault_<hostname>_private_key
# secret before this role is applied to it.
- name: Deploy host-specific private key to root
  ansible.builtin.copy:
    content: "{{ lookup('vars', 'vault_' ~ inventory_hostname ~ '_private_key') }}"
    dest: /root/.ssh/id_ed25519
    mode: '0600'
    owner: root
    group: root
  no_log: true
  tags:
    - ssh
    - private_key
