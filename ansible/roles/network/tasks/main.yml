---
- name: Configure sysctl for persistent IPv4 forwarding
  ansible.builtin.template:
    src: "90-edge-router.conf.j2"
    dest: "{{ paths.etc }}/sysctl.d/90-edge-router.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl configuration

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop, disable, and mask NetworkManager if present
  ansible.builtin.systemd:
    name: NetworkManager
    state: stopped
    enabled: false
    masked: true
  when: "'NetworkManager.service' in ansible_facts.services"

- name: Stop, disable, and mask other legacy network services if present
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - firewalld
    - systemd-resolved
  when: "(item + '.service') in ansible_facts.services"

- name: Copy systemd-networkd WAN network configuration
  ansible.builtin.template:
    src: "20-wan.network.j2"
    dest: "{{ paths.etc }}/systemd/network/20-wan.network"
    owner: root
    group: root
    mode: '0644'

- name: Copy systemd-networkd LAN network configuration
  ansible.builtin.template:
    src: "30-lan.network.j2"
    dest: "{{ paths.etc }}/systemd/network/30-lan.network"
    owner: root
    group: root
    mode: '0644'

- name: Copy systemd-networkd WAN link configuration
  ansible.builtin.template:
    src: "10-wan.link.j2"
    dest: "{{ paths.etc }}/systemd/network/10-wan.link"
    owner: root
    group: root
    mode: '0644'
  notify: Reload udev rules

- name: Ensure systemd network services are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - systemd-networkd
