---
- name: Ensure /etc/step-ca/config directory exists
  ansible.builtin.file:
    path: /etc/step-ca/config
    state: directory
    owner: step
    group: step
    mode: '0700'

- name: Ensure step-ca certificate directory exists
  ansible.builtin.file:
    path: /etc/step-ca/certs
    state: directory
    owner: step
    group: step
    mode: '0700'

- name: Ensure step-ca secrets directory exists
  ansible.builtin.file:
    path: /etc/step-ca/secrets
    state: directory
    owner: step
    group: step
    mode: '0700'

- name: Ensure step-ca db directory exists
  ansible.builtin.file:
    path: /var/lib/step-ca/db
    state: directory
    owner: step
    group: step
    mode: '0700'

- name: Deploy root_ca.crt from vault
  ansible.builtin.copy:
    content: "{{ vault_step_ca_root_crt }}"
    dest: "/etc/step-ca/certs/root_ca.crt"
    owner: step
    group: step
    mode: '0644'
  no_log: true

- name: Deploy intermediate_ca.crt from vault
  ansible.builtin.copy:
    content: "{{ vault_step_ca_intermediate_crt }}"
    dest: "/etc/step-ca/certs/intermediate_ca.crt"
    owner: step
    group: step
    mode: '0644'
  no_log: true

- name: Deploy root_ca_key from vault
  ansible.builtin.copy:
    content: "{{ vault_step_ca_root_key }}"
    dest: "/etc/step-ca/secrets/root_ca_key"
    owner: step
    group: step
    mode: '0600'
  no_log: true

- name: Deploy intermediate_ca_key from vault
  ansible.builtin.copy:
    content: "{{ vault_step_ca_intermediate_key }}"
    dest: "/etc/step-ca/secrets/intermediate_ca_key"
    owner: step
    group: step
    mode: '0600'
  no_log: true

- name: Deploy CA password from vault
  ansible.builtin.copy:
    content: "{{ vault_step_ca_password }}"
    dest: "/etc/step-ca/password"
    owner: step
    group: step
    mode: '0600'
  no_log: true

- name: Check if step-ca is already initialized
  ansible.builtin.stat:
    path: /etc/step-ca/config/ca.json
  register: step_ca_config

- name: Initialize step-ca if not already done
  ansible.builtin.command:
    cmd: >
      step ca init
      --root /etc/step-ca/certs/root_ca.crt
      --key /etc/step-ca/secrets/root_ca_key
      --ca-url https://ca.rsk.al:9000
      --name "Step Online CA"
      --dns ca.rsk.al,10.64.0.1,127.0.0.1,localhost
      --address :9000
      --provisioner labs@raskal.io
      --password-file /etc/step-ca/password
      --ssh
      --acme
      --deployment-type standalone
      --no-db
  when: not step_ca_config.stat.exists
  become: yes
  become_user: step
  environment:
    STEPPATH: /etc/step-ca
  no_log: true

- name: Extract JWK parameters from initialized CA
  ansible.builtin.slurp:
    src: /etc/step-ca/config/ca.json
  register: step_ca_config_content
  when: not step_ca_config.stat.exists

- name: Set JWK facts for template
  ansible.builtin.set_fact:
    step_ca_jwk_kid: "{{ (step_ca_config_content.content | b64decode | from_json).authority.provisioners[0].key.kid }}"
    step_ca_jwk_x: "{{ (step_ca_config_content.content | b64decode | from_json).authority.provisioners[0].key.x }}"
    step_ca_jwk_y: "{{ (step_ca_config_content.content | b64decode | from_json).authority.provisioners[0].key.y }}"
  when: not step_ca_config.stat.exists

- name: Deploy step-ca configuration from dynamic templates
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ infra_services['step-ca']['templates'] | default([]) }}"
  notify: Restart step-ca

- name: Flush handlers to restart step-ca if config changed
  ansible.builtin.meta: flush_handlers

- name: Ensure step-ca service is started and enabled
  ansible.builtin.systemd:
    name: step-ca
    state: started
    enabled: yes
