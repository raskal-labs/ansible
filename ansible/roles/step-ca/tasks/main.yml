---
- name: Ensure /etc/step-ca/config directory exists
  ansible.builtin.file:
    path: /etc/step-ca/config
    state: directory
    owner: step
    group: step
    mode: '0700'

- name: Deploy step-ca configuration
  ansible.builtin.template:
    src: ca.json.j2
    dest: /etc/step-ca/config/ca.json
    owner: step
    group: step
    mode: '0600'
  notify: Restart step-ca

- name: Flush handlers to restart step-ca if config changed
  ansible.builtin.meta: flush_handlers

- name: Ensure step-ca service is started and enabled
  ansible.builtin.systemd:
    name: step-ca
    state: started
    enabled: yes
