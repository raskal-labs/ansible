---
- name: Ensure /etc/wireguard directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy wg0 configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart wg-quick@wg0

- name: Ensure VPN service is enabled and started
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
