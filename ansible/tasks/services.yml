---
- name: Deploy core service configurations
  ansible.builtin.template:
    src: "{{ paths.templates }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
    validate: "{{ item.test | default(omit) }}"
  loop: "{{ profiles.router.files }}"
  notify: "Restart {{ item.svc }}"

- name: Create systemd override directories for applicable services
  ansible.builtin.file:
    path: "{{ paths.etc }}/systemd/system/{{ item.svc }}.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ profiles.router.files | selectattr('override', 'defined') | selectattr('override', 'equalto', true) | list }}"

- name: Deploy systemd overrides for applicable services
  ansible.builtin.template:
    src: "{{ paths.templates }}/{{ item.svc }}-override.conf.j2"
    dest: "{{ paths.etc }}/systemd/system/{{ item.svc }}.service.d/override.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ profiles.router.files | selectattr('override', 'defined') | selectattr('override', 'equalto', true) | list }}"
  notify:
    - Reload systemd daemon
    - "Restart {{ item.svc }}"

- name: Flush handlers before starting new services
  ansible.builtin.meta: flush_handlers

- name: Ensure core networking and DNS services are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - nftables
    - dnscrypt-proxy
    - unbound
    - kea-dhcp4

- name: Verify local DNS lookup via Unbound before resolv.conf update
  ansible.builtin.command: getent ahosts localhost
  changed_when: false

- name: Remove systemd-resolved resolv.conf symlink
  ansible.builtin.file:
    path: "{{ paths.etc }}/resolv.conf"
    state: absent

- name: Create static resolv.conf pointing to local resolver
  ansible.builtin.copy:
    dest: "{{ paths.etc }}/resolv.conf"
    content: "nameserver 127.0.0.1\n"
    owner: root
    group: root
    mode: '0644'
