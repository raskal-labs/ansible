all:
  hosts:
    ultra64:
      identity:
        hostname: ultra64
      profile: router
      status: Operational
      os: Fedora 44 Server Minimal
      network: 64
      host: 1
      hw:
        cpu: AMD RX-427BB Quad-Core APU
        ram: 8GB (2x4GB) DDR3 SODIMM 1600 MT/s
        gpu: Integrated AMD Radeon R7
        storage:
        - dev: M.2 Slot (Primary)
          type: 64GB M.2 2280 SATA SSD
          fs: ext4
          mounts:
          - /boot/efi (976M)
          - / (54.7G)
          - '[SWAP] (3G)'
        slots:
        - 'Low-profile PCIe 2.0 x8 (In Use: Intel 82571EB Dual-Port GbE)'
        ports:
        - 1 x GbE (Realtek)
        - 2 x GbE (Intel)
        - 4 x DisplayPort 1.2
        - 4 x USB 3.0 / 4 x USB 2.0
        - 1 x Serial / 1 x Parallel
      opts:
        grub_timeout: 1
        kernel_args:
        - panic=10
      interfaces:
        wan:
          dev: enp1s0f0
          mac: 24:2F:D0:D1:2E:31
          factory_mac: 00:24:81:81:e0:e4
        lan:
          dev: enp1s0f1
      host_services:
        dhcp:
          network: 64
          range_start: 10.64.0.100
          range_end: 10.64.0.200
          dns_host: 1
          subnet: 10.64.0.0/24
          dns_server: 10.64.0.1
          static_leases:
          - hostname: nx
            mac: 88:76:B9:8F:30:E0
            host: 2
            ip: 10.64.0.2
          - hostname: nitro
            mac: 24:2F:D0:D1:2E:30
            host: 3
            ip: 10.64.0.3
          - hostname: gamecube
            mac: 84:47:09:44:8B:F9
            host: 4
            ip: 10.64.0.4
          - hostname: pi-auditor
            mac: 74:A7:EA:EE:67:ED
            host: 10
            ip: 10.64.0.10
        vpn:
          port: 51820
          privkey: '{{ vault_wg_ultra64_private_key }}'
          host_id: 1
          peers:
          - name: gcp-aider
            pubkey: TPc/hcMYdohDuuD9pkadydtGnUlOTf1q2e4lSYf8e04==
            host_id: 5
            extra_networks:
            - network: 64
              host: 5
            route_lan: true
            extra_ips:
            - 10.64.0.5/24
      packages:
      - conntrack-tools
      - ethtool
      - iftop
      - iperf3
      - net-tools
      - nload
      - nmap
      - socat
      - tcpdump
      - wireguard-tools
      packages_absent:
      - firewalld
      - netbird
      - systemd-resolved
      - dnscrypt-proxy
      host_keys:
        ssh-ed25519: AAAAC3NzaC1lZDI1NTE5AAAAIHkYRIFo0ahYGuBY1pMahq3IFOZSQHzb1287Aj5Rc2Eg
        ssh-rsa: 
      ansible_user: root
      ansible_become: false
      ip: 10.64.0.1
      ansible_host: 10.64.0.1
      network_cidr: 10.64.0.0/24
      network_gateway: 10.64.0.1
  vars:
    global_identities:
    - username: root
      shell: /bin/bash
      state: present
      authorized_clients:
      - name: gameboy
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGCBAHN8wfMIQB53WMvtuwwIef5+6xx6dnWz3ojK3ZHJ
          gameboy
      - name: minty@freshbox
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMZTtS3fiWvIMQzpZk//k6LJ+FKVaQA7NpHc7bBAj0pC
          minty
      - name: root@gamecube
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP7NWiRVdLEnGuc4hOMUVbDPT0oM2VM3oSA335EF4WbS
          gamecube
      - name: raskal@aider-node
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBzccYlHTg5Qj5QgF13+C+Lc0XqpfA8A/v425nrYz60w
          labs@raskal.io
    repo: '{{ playbook_dir | dirname }}'
    paths:
      etc: /etc
      tasks: '{{ repo }}/ansible/tasks'
      templates: '{{ repo }}/ansible/templates'
    pipeline:
      inventory: '{{ repo }}/ansible/inventory/transform.py'
      playbook_pattern: '{{ repo }}/ansible/{action}-{host}.yml'
    domains:
      local: rsk.al
      public: raskal.io
    tz: America/Vancouver
    users:
    - name: root
      role: Root
      home: /root
      state: present
    - name: raskal
      role: Admin
      email: labs@raskal.io
      home: /home/raskal
      state: present
    packages:
    - avahi
    - bind-utils
    - blocky
    - caddy
    - conntrack-tools
    - curl
    - ethtool
    - git
    - headscale
    - htop
    - iftop
    - ipcalc
    - iperf3
    - kea
    - mtr
    - nano
    - net-tools
    - nftables
    - nload
    - nmap
    - socat
    - step-ca
    - step-cli
    - tcpdump
    - tmux
    - traceroute
    - tree
    - unbound
    - wget
    - wireguard-tools
    packages_absent:
    - dnscrypt-proxy
    - firewalld
    - netbird
    - systemd-resolved
    ntp_servers:
    - 0.fedora.pool.ntp.org
    - 1.fedora.pool.ntp.org
    - 2.fedora.pool.ntp.org
    - 3.fedora.pool.ntp.org
    networks:
      vlan-64:
        id: vlan-64
        network: 64
        prefix_len: 24
        cidr: 10.64.0.0/24
        gateway: 10.64.0.1
        subnet_mask: 255.255.255.0
        broadcast: 10.64.0.255
        network_address: 10.64.0.0
      vlan-32:
        id: vlan-32
        network: 32
        prefix_len: 24
        cidr: 10.32.0.0/24
        gateway: 10.32.0.1
        subnet_mask: 255.255.255.0
        broadcast: 10.32.0.255
        network_address: 10.32.0.0
    infra_services:
      caddy:
        id: caddy
        security_profile: hardened
        packages:
        - caddy
        email: labs@raskal.io
        tls_profiles:
          sovereign_tls:
            type: acme
            endpoint: https://ca.rsk.al:9000/acme/acme/directory
            trusted_roots: /etc/step-ca/certs/root_ca.crt
        auth_profiles:
          auth_gate:
            backend_network: 64
            backend_host: 203
            backend_port: 9091
            uri: /api/authz/forward-auth?authelia_url=https://auth.rsk.al/
            backend: 10.64.0.203:9091
          auth_gate_public:
            backend_network: 64
            backend_host: 203
            backend_port: 9091
            uri: /api/authz/forward-auth?authelia_url=https://auth.raskal.io/
            backend: 10.64.0.203:9091
        services:
        - name: homeassistant_wan
          domains:
          - haos.raskal.io
          - ha.raskal.io
          backend_network: 64
          backend_host: 233
          backend_port: 8123
          backend: 10.64.0.233:8123
        - name: dawarich_wan
          domains:
          - map.raskal.io
          backend_network: 64
          backend_host: 204
          backend_port: 3000
          backend: 10.64.0.204:3000
        - name: copyparty_wan
          domains:
          - pc.raskal.io
          auth: auth_gate_public
          backend_network: 64
          backend_host: 237
          backend_port: 3923
          backend: 10.64.0.237:3923
        - name: proxmox_wan
          domains:
          - gcn.raskal.io
          - gamecube.raskal.io
          backend_network: 64
          backend_host: 4
          backend_port: 8006
          tls_insecure_skip_verify: true
          backend: 10.64.0.4:8006
        - name: dns_wan
          domains:
          - dns.raskal.io
          action: doh_public
          backend_network: 64
          backend_host: 1
          backend_port: 4000
          backend: 10.64.0.1:4000
        - name: headscale_wan
          domains:
          - wfc.raskal.io
          action: headscale
          backend: 127.0.0.1:8080
        - name: auth_wan
          domains:
          - auth.raskal.io
          backend_network: 64
          backend_host: 203
          backend_port: 9091
          backend: 10.64.0.203:9091
        - name: pairdrop_wan
          domains:
          - zapper.raskal.io
          backend_network: 64
          backend_host: 232
          backend_port: 3000
          backend: 10.64.0.232:3000
        - name: auth_lan
          domains:
          - auth.rsk.al
          tls: sovereign_tls
          backend_network: 64
          backend_host: 203
          backend_port: 9091
          backend: 10.64.0.203:9091
        - name: ldap_lan
          domains:
          - ldap.rsk.al
          tls: sovereign_tls
          backend_network: 64
          backend_host: 203
          backend_port: 17170
          backend: 10.64.0.203:17170
        - name: dns_lan
          domains:
          - dns.rsk.al
          tls: sovereign_tls
          action: doh_internal
          backend_network: 64
          backend_host: 1
          backend_port: 4000
          backend: 10.64.0.1:4000
        - name: homeassistant_lan
          domains:
          - ha.rsk.al
          - haos.rsk.al
          tls: sovereign_tls
          backend_network: 64
          backend_host: 233
          backend_port: 8123
          backend: 10.64.0.233:8123
        - name: proxmox_lan
          domains:
          - pve.rsk.al
          - gcn.rsk.al
          - gamecube.rsk.al
          tls: sovereign_tls
          backend_network: 64
          backend_host: 4
          backend_port: 8006
          tls_insecure_skip_verify: true
          backend: 10.64.0.4:8006
        - name: dawarich_lan
          domains:
          - map.rsk.al
          tls: sovereign_tls
          action: redir
          redir_target: https://map.raskal.io{uri}
        - name: copyparty_lan
          domains:
          - pc.rsk.al
          tls: sovereign_tls
          auth: auth_gate
          backend_network: 64
          backend_host: 237
          backend_port: 3923
          backend: 10.64.0.237:3923
        - name: pairdrop_lan
          domains:
          - zapper.rsk.al
          tls: sovereign_tls
          backend_network: 64
          backend_host: 232
          backend_port: 3000
          backend: 10.64.0.232:3000
        - name: nitro
          domains:
          - ntr.rsk.al
          tls: sovereign_tls
          backend_network: 64
          backend_host: 3
          backend_port: 80
          backend: 10.64.0.3:80
        - name: ultra64
          domains:
          - u64.rsk.al
          tls: sovereign_tls
          action: respond
          response_msg: '[REDACTED]-labs'
          response_code: 200
        - name: nx
          domains:
          - nx.rsk.al
          tls: sovereign_tls
          backend_network: 64
          backend_host: 2
          backend_port: 80
          backend: 10.64.0.2:80
        - name: dolphin
          domains:
          - dol.rsk.al
          tls: sovereign_tls
          backend_network: 64
          backend_host: 4
          backend_port: 80
          backend: 10.64.0.4:80
      firewall:
        id: firewall
        security_profile: strict
        packages:
        - nftables
        templates:
        - source: nftables.conf.j2
          destination: /etc/nftables.conf
      headscale:
        id: headscale
        security_profile: hardened
        mesh_subnet: 100.64.0.0/24
        mesh_gateway_network: 64
        mesh_gateway_host: 4
        derp:
          port: 3478
        server:
          host_network: 64
          host: 1
          grpc_port: 50443
          metrics_port: 9090
          db_path: /var/lib/headscale/db.sqlite
        packages:
        - headscale
        templates:
        - source: headscale.yaml.j2
          destination: /etc/headscale/config.yaml
        state:
          db_backup_path: /root/headscale-db-backups/
        description: 'Headscale self-hosted VPN mesh coordination server. Runs on
          ultra64 (the router, 10.64.0.1). Exposes the coordination endpoint wfc.raskal.io
          via Caddy reverse proxy on the same host. DERP/STUN traffic is forwarded
          directly on UDP 3478. gamecube (10.64.0.4) acts as the mesh exit node /
          subnet router within the Headscale mesh, but does NOT run the server. Clients
          enroll using: tailscale up --login-server https://wfc.raskal.io

          '
        mesh_gateway_ip: 10.64.0.4
      dns:
        id: dns
        packages:
        - unbound
        - blocky
        http_port: 4000
        blocklists:
        - https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        - https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
        - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/GameConsoleAdblockList.txt
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.txt
        - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt
        custom_dns:
        - hostname: u64.rsk.al
          network: 64
          host: 1
          ip: 10.64.0.1
        - hostname: nx.rsk.al
          network: 64
          host: 2
          ip: 10.64.0.2
        - hostname: nitro.rsk.al
          network: 64
          host: 3
          ip: 10.64.0.3
        - hostname: dol.rsk.al
          network: 64
          host: 4
          ip: 10.64.0.4
        - hostname: ca.rsk.al
          network: 64
          host: 1
          ip: 10.64.0.1
        - hostname: '*.rsk.al'
          network: 64
          host: 202
          ip: 10.64.0.202
        unbound:
          chroot: ''
          do_not_query_localhost: 'no'
        caching:
          min_ttl: 60
          max_ttl: 86400
        templates:
        - source: unbound.conf.j2
          destination: /etc/unbound/unbound.conf
        - source: blocky.yml.j2
          destination: /etc/blocky/blocky.yml
      dhcp:
        id: dhcp
        security_profile: hardened
        packages:
        - kea
        templates:
        - source: kea-dhcp4.conf.j2
          destination: /etc/kea/kea-dhcp4.conf
      avahi:
        id: avahi
        security_profile: baseline
        packages:
        - avahi
        templates:
        - source: avahi-daemon.conf.j2
          destination: /etc/avahi/avahi-daemon.conf
      step-ca:
        id: step-ca
        packages:
        - step-cli
        - step-ca
        port: 9000
        domain: ca.rsk.al
        name: Step Online CA
      vpn:
        id: vpn
        security_profile: strict
        prefix: 100.64.1
        prefix_len: 24
        packages:
        - wireguard-tools
        templates:
        - source: wg0.conf.j2
          destination: /etc/wireguard/wg0.conf
        cidr: 100.64.1.0/24
