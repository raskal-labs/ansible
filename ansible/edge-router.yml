---
- name: Configure Edge Router ultra-64
  hosts: ultra-64
  become: true
  vars:
    min_ansible_version: "2.15.0"
  tasks:
    - name: Ensure Ansible version requirement
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(min_ansible_version, '>=')
        fail_msg: "Ansible {{ min_ansible_version }} or newer is required."

    - name: Log playbook execution start to system journal
      ansible.builtin.command: logger -t ansible-edge-router -p syslog.info "Starting edge router configuration playbook run."
      changed_when: false

    - name: Main Configuration Execution
      block:
        # --- Step 1: Install required packages while active network is operating ---
        - name: Install required packages using dnf5
          ansible.builtin.dnf5:
            name: "{{ packages }}"
            state: present

        # --- Step 2: Render & validate configurations ---
        - name: Configure sysctl for persistent IPv4 forwarding
          ansible.builtin.template:
            src: templates/90-edge-router.conf.j2
            dest: /etc/sysctl.d/90-edge-router.conf
            owner: root
            group: root
            mode: '0644'
          notify: Apply sysctl configuration

        - name: Copy systemd-networkd WAN network configuration
          ansible.builtin.template:
            src: templates/20-wan.network.j2
            dest: /etc/systemd/network/20-wan.network
            owner: root
            group: root
            mode: '0644'

        - name: Copy systemd-networkd LAN network configuration
          ansible.builtin.template:
            src: templates/30-lan.network.j2
            dest: /etc/systemd/network/30-lan.network
            owner: root
            group: root
            mode: '0644'

        - name: Deploy core service configurations
          ansible.builtin.template:
            src: "{{ item.src }}"
            dest: "{{ item.target_dest }}"
            owner: root
            group: root
            mode: "{{ file_modes[item.service] | default('0644') }}"
            validate: "{{ validate_cmds[item.service] | default(omit) }}"
          loop: "{{ service_profiles.edge_router.configurations }}"
          vars:
            validate_cmds:
              nftables: "nft -c -f %s"
              kea-dhcp4: "kea-dhcp4 -t %s"
              unbound: "unbound-checkconf %s"
              dnscrypt-proxy: "dnscrypt-proxy -check -config %s"
            file_modes:
              nftables: "0600"
              kea-dhcp4: "0640"
          notify: "Restart {{ item.service }}"

        # --- Step 3: Install systemd overrides ---
        - name: Create systemd override directories for applicable services
          ansible.builtin.file:
            path: "/etc/systemd/system/{{ item.service }}.service.d"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop: "{{ service_profiles.edge_router.configurations | selectattr('has_override', 'defined') | selectattr('has_override', 'equalto', true) | list }}"

        - name: Deploy systemd overrides for applicable services
          ansible.builtin.template:
            src: "templates/{{ item.service }}-override.conf.j2"
            dest: "/etc/systemd/system/{{ item.service }}.service.d/override.conf"
            owner: root
            group: root
            mode: '0644'
          loop: "{{ service_profiles.edge_router.configurations | selectattr('has_override', 'defined') | selectattr('has_override', 'equalto', true) | list }}"
          notify:
            - Reload systemd daemon
            - "Restart {{ item.service }}"

        - name: Flush handlers before starting new services
          ansible.builtin.meta: flush_handlers

        # --- Step 4: Host identity, Accounts & GRUB configuration ---
        - name: Set system hostname
          ansible.builtin.hostname:
            name: "{{ inventory_hostname }}"

        - name: Set system timezone
          ansible.builtin.timezone:
            name: "{{ timezone }}"

        - name: Ensure global accounts exist
          ansible.builtin.user:
            name: "{{ item.username }}"
            home: "{{ item.directory }}"
            state: "{{ 'present' if item.status == 'Active' else 'absent' }}"
          loop: "{{ environment.global_accounts }}"

        - name: Configure GRUB timeout
          ansible.builtin.lineinfile:
            path: /etc/default/grub
            regexp: '^GRUB_TIMEOUT='
            line: "GRUB_TIMEOUT={{ computing_nodes[0].grub_timeout }}"
          notify: Regenerate GRUB config

        - name: Check current kernel parameters
          ansible.builtin.command: grubby --info=DEFAULT
          register: grubby_info
          changed_when: false

        - name: Ensure required kernel parameters are set
          ansible.builtin.command: "grubby --update-kernel=ALL --args=\"{{ item }}\""
          loop: "{{ computing_nodes[0].kernel_parameters }}"
          when: "item not in grubby_info.stdout"

        # --- Step 5: Transition network stack & start services ---
        - name: Gather service facts
          ansible.builtin.service_facts:

        - name: Stop, disable, and mask NetworkManager if present
          ansible.builtin.systemd:
            name: NetworkManager
            state: stopped
            enabled: false
            masked: true
          when: "'NetworkManager.service' in ansible_facts.services"

        - name: Copy systemd-networkd WAN link configuration
          ansible.builtin.template:
            src: templates/10-wan.link.j2
            dest: /etc/systemd/network/10-wan.link
            owner: root
            group: root
            mode: '0644'
          notify: Reload udev rules

        - name: Stop, disable, and mask other legacy network services if present
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
            enabled: false
            masked: true
          loop:
            - firewalld
            - systemd-resolved
          when: "(item + '.service') in ansible_facts.services"

        - name: Ensure systemd network services are enabled and started
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: started
            enabled: true
          loop:
            - systemd-networkd
            - systemd-networkd-wait-online

        - name: Ensure core networking and DNS services are enabled and started
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: started
            enabled: true
          loop:
            - nftables
            - dnscrypt-proxy
            - unbound
            - kea-dhcp4

        # --- Step 6: Resolver cutover ---
        - name: Verify local DNS lookup via Unbound before resolv.conf update
          ansible.builtin.command: getent ahosts localhost
          changed_when: false

        - name: Remove systemd-resolved resolv.conf symlink
          ansible.builtin.file:
            path: /etc/resolv.conf
            state: absent

        - name: Create static resolv.conf pointing to local resolver
          ansible.builtin.copy:
            dest: /etc/resolv.conf
            content: "nameserver {{ environment.ipam.local_resolver }}\n"
            owner: root
            group: root
            mode: '0644'

        # --- Step 7: Post-deployment health assertions ---
        - name: Check sysctl IPv4 forwarding
          ansible.builtin.command: sysctl net.ipv4.ip_forward
          register: sysctl_ip_forward
          changed_when: false

        - name: Assert IPv4 forwarding is active
          ansible.builtin.assert:
            that: "'net.ipv4.ip_forward = 1' in sysctl_ip_forward.stdout"
            success_msg: "IPv4 forwarding is properly configured."
            fail_msg: "CRITICAL: IPv4 forwarding is not active! Router will not route packets."

        - name: Check nftables ruleset
          ansible.builtin.command: nft list ruleset
          register: nft_ruleset
          changed_when: false

        - name: Assert nftables ruleset is populated
          ansible.builtin.assert:
            that: "'table inet global' in nft_ruleset.stdout"
            success_msg: "nftables firewall ruleset is active."
            fail_msg: "CRITICAL: The 'inet global' table is missing from nftables. Firewall is not loaded!"

        - name: Check default WAN route
          ansible.builtin.command: ip route show default
          register: wan_default_route
          changed_when: false

        - name: Assert default WAN route exists
          ansible.builtin.assert:
            that: "wan_default_route.stdout != ''"
            success_msg: "Default route is present."
            fail_msg: "CRITICAL: No default WAN route exists. Router has no upstream internet access."

      rescue:
        - name: Log critical failure to system journal
          ansible.builtin.command: logger -t ansible-edge-router -p syslog.err "CRITICAL: Playbook execution failed. Check Ansible console output for details."
          changed_when: false
        
        - name: Abort playbook execution
          ansible.builtin.fail:
            msg: "Playbook execution encountered an error and has halted safely. A failure event was written to journalctl."

      always:
        - name: Log playbook execution completion to system journal
          ansible.builtin.command: logger -t ansible-edge-router -p syslog.info "Edge router configuration playbook run finished."
          changed_when: false

  handlers:
    - name: Apply sysctl configuration
      ansible.builtin.command: sysctl --system

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Regenerate GRUB config
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg

    - name: Reload udev rules
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - udevadm control --reload-rules && udevadm trigger

    - name: Restart nftables
      ansible.builtin.systemd:
        name: nftables
        state: restarted

    - name: Restart kea-dhcp4
      ansible.builtin.systemd:
        name: kea-dhcp4
        state: restarted

    - name: Restart unbound
      ansible.builtin.systemd:
        name: unbound
        state: restarted

    - name: Restart dnscrypt-proxy
      ansible.builtin.systemd:
        name: dnscrypt-proxy
        state: restarted
