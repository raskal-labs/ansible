---
- name: Configure Edge Router ultra-64
  hosts: ultra-64
  become: true
  vars:
    min_ansible_version: "2.15.0"
  tasks:
    - name: Ensure Ansible version requirement
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(min_ansible_version, '>=')
        fail_msg: "Ansible {{ min_ansible_version }} or newer is required."

    # --- Step 1: Install required packages while active network is operating ---
    - name: Install required packages using dnf5
      ansible.builtin.dnf5:
        name: "{{ packages }}"
        state: present

    # --- Step 2: Render & validate configurations ---
    - name: Configure sysctl for persistent IPv4 forwarding
      ansible.builtin.template:
        src: templates/90-edge-router.conf.j2
        dest: /etc/sysctl.d/90-edge-router.conf
        owner: root
        group: root
        mode: '0644'
      notify: Apply sysctl configuration

    - name: Copy systemd-networkd link configuration
      ansible.builtin.template:
        src: templates/10-wan.link.j2
        dest: /etc/systemd/network/10-wan.link
        owner: root
        group: root
        mode: '0644'
      notify: Notify link configuration reboot required

    - name: Copy systemd-networkd WAN network configuration
      ansible.builtin.template:
        src: templates/20-wan.network.j2
        dest: /etc/systemd/network/20-wan.network
        owner: root
        group: root
        mode: '0644'
      notify: Restart systemd-networkd

    - name: Copy systemd-networkd LAN network configuration
      ansible.builtin.template:
        src: templates/30-lan.network.j2
        dest: /etc/systemd/network/30-lan.network
        owner: root
        group: root
        mode: '0644'
      notify: Restart systemd-networkd

    - name: Copy nftables configuration
      ansible.builtin.template:
        src: templates/nftables.conf.j2
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: '0600'
        validate: 'nft -c -f %s'
      notify: Restart nftables

    - name: Copy Kea DHCPv4 configuration
      ansible.builtin.template:
        src: templates/kea-dhcp4.conf.j2
        dest: /etc/kea/kea-dhcp4.conf
        owner: root
        group: root
        mode: '0640'
        validate: 'kea-dhcp4 -t %s'
      notify: Restart kea-dhcp4

    - name: Copy Unbound configuration
      ansible.builtin.template:
        src: templates/unbound.conf.j2
        dest: /etc/unbound/unbound.conf
        owner: root
        group: root
        mode: '0644'
        validate: 'unbound-checkconf %s'
      notify: Restart unbound

    - name: Copy dnscrypt-proxy configuration
      ansible.builtin.template:
        src: templates/dnscrypt-proxy.toml.j2
        dest: /etc/dnscrypt-proxy/dnscrypt-proxy.toml
        owner: root
        group: root
        mode: '0644'
      notify: Restart dnscrypt-proxy

    # --- Step 3: Install systemd overrides ---
    - name: Create systemd override directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - unbound
        - dnscrypt-proxy
        - kea-dhcp4

    - name: Copy Unbound systemd override
      ansible.builtin.template:
        src: templates/unbound-override.conf.j2
        dest: /etc/systemd/system/unbound.service.d/override.conf
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd daemon
        - Restart unbound

    - name: Copy dnscrypt-proxy systemd override
      ansible.builtin.template:
        src: templates/dnscrypt-proxy-override.conf.j2
        dest: /etc/systemd/system/dnscrypt-proxy.service.d/override.conf
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd daemon
        - Restart dnscrypt-proxy

    - name: Copy Kea DHCPv4 systemd override
      ansible.builtin.template:
        src: templates/kea-override.conf.j2
        dest: /etc/systemd/system/kea-dhcp4.service.d/override.conf
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd daemon
        - Restart kea-dhcp4

    - name: Flush handlers before starting new services
      ansible.builtin.meta: flush_handlers

    # --- Step 4: Host identity & GRUB configuration ---
    - name: Set system hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Set system timezone
      ansible.builtin.timezone:
        name: "{{ timezone }}"

    - name: Configure GRUB timeout
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT='
        line: 'GRUB_TIMEOUT=1'
      notify: Regenerate GRUB config

    - name: Check current kernel parameters
      ansible.builtin.command: grubby --info=DEFAULT
      register: grubby_info
      changed_when: false

    - name: Ensure panic=10 kernel parameter is set
      ansible.builtin.command: grubby --update-kernel=ALL --args="panic=10"
      when: "'panic=10' not in grubby_info.stdout"

    # --- Step 5: Transition network stack & start services ---
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Stop, disable, and mask legacy network services if present
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - NetworkManager
        - firewalld
        - systemd-resolved
      when: "(item + '.service') in ansible_facts.services"

    - name: Ensure systemd network services are enabled and started
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - systemd-networkd
        - systemd-networkd-wait-online

    - name: Ensure core networking and DNS services are enabled and started
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nftables
        - dnscrypt-proxy
        - unbound
        - kea-dhcp4

    # --- Step 6: Resolver cutover ---
    - name: Verify local DNS lookup via Unbound before resolv.conf update
      ansible.builtin.command: getent ahosts localhost
      changed_when: false

    - name: Remove systemd-resolved resolv.conf symlink
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent

    - name: Create static resolv.conf pointing to localhost
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: "nameserver 127.0.0.1\n"
        owner: root
        group: root
        mode: '0644'

    # --- Step 7: Post-deployment health assertions ---
    - name: Verify sysctl IPv4 forwarding is active
      ansible.builtin.command: sysctl net.ipv4.ip_forward
      register: sysctl_ip_forward
      failed_when: "'net.ipv4.ip_forward = 1' not in sysctl_ip_forward.stdout"
      changed_when: false

    - name: Verify nftables ruleset is populated
      ansible.builtin.command: nft list ruleset
      register: nft_ruleset
      failed_when: "'table inet global' not in nft_ruleset.stdout"
      changed_when: false

    - name: Verify default WAN route exists
      ansible.builtin.command: ip route show default
      register: wan_default_route
      failed_when: wan_default_route.stdout == ""
      changed_when: false

  handlers:
    - name: Apply sysctl configuration
      ansible.builtin.command: sysctl --system

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Regenerate GRUB config
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg

    - name: Restart systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted

    - name: Restart nftables
      ansible.builtin.systemd:
        name: nftables
        state: restarted

    - name: Restart kea-dhcp4
      ansible.builtin.systemd:
        name: kea-dhcp4
        state: restarted

    - name: Restart unbound
      ansible.builtin.systemd:
        name: unbound
        state: restarted

    - name: Restart dnscrypt-proxy
      ansible.builtin.systemd:
        name: dnscrypt-proxy
        state: restarted

    - name: Notify link configuration reboot required
      ansible.builtin.debug:
        msg: "WAN .link configuration changed. A reboot is required to re-apply udev interface naming rules."
