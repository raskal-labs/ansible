---
- name: Configure Edge Router ultra-64
  hosts: ultra-64
  become: true
  
  vars_files:
    - "{{ playbook_dir }}/../data/environment.yaml"
    - "{{ playbook_dir }}/../data/compute.yaml"
    - "{{ playbook_dir }}/../data/services.yaml"
    
  vars:
    min_ansible_version: "2.15.0"
    
  tasks:
    - name: Ensure Ansible version requirement
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(min_ansible_version, '>=')

    - name: Log playbook execution start to system journal
      ansible.builtin.command: logger -t ansible-edge-router -p syslog.info "Starting edge router configuration playbook run."
      changed_when: false

    - name: Main Configuration Execution
      block:
        - name: Phase 1 - Base OS Configuration
          ansible.builtin.import_tasks: "{{ paths.tasks }}/base.yml"
          
        - name: Phase 2 - Network Stack Transition
          ansible.builtin.import_tasks: "{{ paths.tasks }}/network.yml"

        - name: Phase 2.5 - Firewall & NAT Policies
          ansible.builtin.import_tasks: "{{ paths.tasks }}/firewall.yml"
          
        - name: Phase 3 - Core Services Deployment
          ansible.builtin.import_tasks: "{{ paths.tasks }}/services.yml"

      rescue:
        - name: Log critical failure to system journal
          ansible.builtin.command: logger -t ansible-edge-router -p syslog.err "CRITICAL - Playbook execution failed."
          changed_when: false
        
        - name: Abort playbook execution
          ansible.builtin.fail:
            msg: "Playbook execution encountered an error and has halted safely. See journalctl."

      always:
        - name: Log playbook execution completion
          ansible.builtin.command: logger -t ansible-edge-router -p syslog.info "Edge router configuration playbook run finished."
          changed_when: false

  handlers:
    - name: Apply sysctl configuration
      ansible.builtin.command: sysctl --system

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Regenerate GRUB config
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg

    - name: Reload udev rules
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - udevadm control --reload-rules && udevadm trigger

    - name: Restart nftables
      ansible.builtin.systemd:
        name: nftables
        state: restarted

    - name: Restart dnscrypt-proxy
      ansible.builtin.systemd:
        name: dnscrypt-proxy
        state: restarted

    - name: Restart unbound
      ansible.builtin.systemd:
        name: unbound
        state: restarted

    - name: Restart kea-dhcp4
      ansible.builtin.systemd:
        name: kea-dhcp4
        state: restarted
